{% extends "base.html" %}
{% block content %}

<div class="waterfall">
    {% for word in words %}
    <div class="word-card">
        <h2>{{word["word"]}}</h2>
        <p>出处：{{word["source"]}}</p>
        <p>解释：{{word["mean"]}}</p>
        {% if word["note"] %}
            <p>备注：{{word["note"]}}</p>
        {% endif %}
        <p>记录时间：{{word["create_time"]}}</p>
    </div>
    {% endfor %}

    
</div>
{% endblock %}
