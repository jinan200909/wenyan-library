{% extends "base.html" %}

{% block title %}添加词条{% endblock %}

{% block content %}
<div class="add-box">
    <h2>
        <span>
            添加词条
        </span>
    </h2>
    <form method="post" action="/add">
        <input name="word" placeholder="词语">
        <input name="mean" placeholder="解释">
        <input name="source" placeholder="出处">
        <input name="note" placeholder="备注">
        <button type="submit">保存</button>
    </form>
</div>
{% endblock %}
